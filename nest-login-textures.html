<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Nest — Left Panel Textures</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1410;font-family:'DM Sans',sans-serif;overflow:hidden;}
.wrap{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#111009;border-bottom:1px solid #2a2318;}
.hdr-logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:#e8dcc8;}
.hdr-pills{display:flex;gap:6px;}
.pill{font-size:11px;color:#6b5e4a;background:#1e1a13;border:1px solid #2e2820;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all .14s;font-family:'Space Grotesk',sans-serif;}
.pill.on{color:#e8dcc8;background:#2e2820;border-color:#3e3428;}
.scroll{flex:1;overflow:auto;padding:36px 36px 56px;display:flex;flex-direction:column;gap:52px;}
.section-lbl{font-family:'Space Grotesk',sans-serif;font-size:10px;color:#3e3428;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.section-lbl strong{color:#7a6a54;}
.frame{border-radius:12px;overflow:hidden;border:1px solid #2a2318;width:1000px;height:600px;flex-shrink:0;}
.tweaks-panel{position:fixed;bottom:22px;right:22px;background:#1e1a13;border:1px solid #2e2820;border-radius:12px;padding:16px 18px;width:210px;z-index:999;display:none;}
.tweaks-panel.on{display:block;}
.tw-title{font-size:10px;font-weight:700;color:#6b5e4a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;}
.tw-lbl{font-size:11px;color:#5a4e3a;margin-bottom:5px;}
.tw-opts{display:flex;gap:5px;flex-wrap:wrap;}
.tw-opt{font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid #2a2318;background:#111009;color:#6b5e4a;cursor:pointer;transition:all .12s;font-family:'Space Grotesk',sans-serif;}
.tw-opt.on{background:#2e2820;border-color:#3e3428;color:#e8dcc8;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

/* ── shared warm form panel ── */
function FormPanel() {
  const [role, setRole] = useState("student");
  const accent = "#b5451b";
  return (
    <div style={{
      width:380,flexShrink:0,
      background:"#faf7f2",
      display:"flex",flexDirection:"column",justifyContent:"center",
      padding:"48px 40px",
      borderLeft:"1px solid #e8e0d4"
    }}>
      <div style={{fontFamily:"'Instrument Serif',serif",fontSize:26,color:"#2a1f14",marginBottom:5}}>Welcome back</div>
      <div style={{fontSize:13,color:"#a09180",marginBottom:28,fontFamily:"'DM Sans',sans-serif"}}>Sign in to continue to nest</div>
      <div style={{marginBottom:22}}>
        <div style={{fontSize:10,color:"#a09180",marginBottom:7,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.06em"}}>I AM A</div>
        <div style={{display:"flex",gap:0,background:"#f0ebe3",borderRadius:10,padding:3,border:"1px solid #e0d8cc"}}>
          {["Student","Club"].map(r=>(
            <button key={r} onClick={()=>setRole(r.toLowerCase())} style={{
              flex:1,padding:"8px",borderRadius:8,border:"none",
              background:role===r.toLowerCase()?"#fff":"transparent",
              color:role===r.toLowerCase()?"#2a1f14":"#a09180",
              fontWeight:role===r.toLowerCase()?600:400,
              fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",
              boxShadow:role===r.toLowerCase()?"0 1px 4px rgba(0,0,0,0.08)":"none",
              transition:"all .15s"
            }}>{r}</button>
          ))}
        </div>
      </div>
      {["Email","Password"].map((f,i)=>(
        <div key={f} style={{marginBottom:14}}>
          <div style={{fontSize:10,color:"#a09180",marginBottom:6,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.06em"}}>{f.toUpperCase()}</div>
          <input type={i===1?"password":"email"} placeholder={`Enter your ${f.toLowerCase()}`} style={{
            width:"100%",padding:"11px 14px",borderRadius:10,
            border:"1px solid #e0d8cc",background:"#fff",
            color:"#2a1f14",fontSize:13,outline:"none",
            fontFamily:"'DM Sans',sans-serif"
          }}/>
        </div>
      ))}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#a09180",cursor:"pointer"}}>
          <input type="checkbox" style={{accentColor:accent}}/> Remember me
        </label>
        <span style={{fontSize:12,color:accent,cursor:"pointer",fontWeight:500}}>Forgot password?</span>
      </div>
      <button style={{
        width:"100%",padding:"12px",borderRadius:10,border:"none",
        background:accent,color:"#fff",fontSize:14,fontWeight:600,
        cursor:"pointer",fontFamily:"'DM Sans',sans-serif",
        boxShadow:"0 4px 16px rgba(181,69,27,0.28)"
      }}>Sign in</button>
      <div style={{textAlign:"center",marginTop:16,fontSize:12,color:"#b8a898"}}>
        Don't have an account? <span style={{color:accent,cursor:"pointer",fontWeight:500}}>Register</span>
      </div>
    </div>
  );
}

/* shared left panel shell */
function Left({children}) {
  return (
    <div style={{
      flex:1,background:"#f2ebe0",
      display:"flex",flexDirection:"column",
      justifyContent:"center",alignItems:"center",
      position:"relative",overflow:"hidden",padding:48
    }}>
      {children}
      <div style={{textAlign:"center",position:"relative",zIndex:2}}>
        <div style={{fontFamily:"'Instrument Serif',serif",fontSize:56,color:"#2a1f14",lineHeight:1,letterSpacing:"-1px",fontStyle:"italic"}}>nest</div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:14,color:"#a09180",marginTop:10,lineHeight:1.6,maxWidth:260}}>All your campus opportunities,<br/>in one place</div>
      </div>
    </div>
  );
}

/* ── TEXTURE 1: Dot grid ── */
function TextureDots() {
  return (
    <div style={{display:"flex",height:"100%",background:"#faf7f2"}}>
      <Left>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%"}} xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
              <circle cx="12" cy="12" r="1.5" fill="#b5451b" opacity="0.18"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#dots)"/>
        </svg>
        {/* radial fade to reveal center */}
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 55% 55% at 50% 50%,#f2ebe0 30%,transparent 100%)"}}/>
      </Left>
      <FormPanel/>
    </div>
  );
}

/* ── TEXTURE 2: Topographic contour lines ── */
function TextureTopo() {
  return (
    <div style={{display:"flex",height:"100%",background:"#faf7f2"}}>
      <Left>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.22}} viewBox="0 0 620 600" preserveAspectRatio="xMidYMid slice">
          {/* concentric irregular paths suggesting topo map */}
          {[0,1,2,3,4,5,6,7].map(i=>(
            <ellipse key={i}
              cx="310" cy="300"
              rx={60+i*48} ry={44+i*36}
              fill="none" stroke="#7a4a2a" strokeWidth="1"
              transform={`rotate(${i*12} 310 300)`}
            />
          ))}
          {[0,1,2,3,4].map(i=>(
            <ellipse key={"b"+i}
              cx="160" cy="160"
              rx={30+i*32} ry={22+i*24}
              fill="none" stroke="#b5451b" strokeWidth="0.8"
              transform={`rotate(${i*18} 160 160)`}
            />
          ))}
          {[0,1,2,3].map(i=>(
            <ellipse key={"c"+i}
              cx="480" cy="440"
              rx={24+i*28} ry={18+i*20}
              fill="none" stroke="#7a4a2a" strokeWidth="0.8"
              transform={`rotate(${i*22} 480 440)`}
            />
          ))}
        </svg>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 50% 50% at 50% 50%,#f2ebe0 25%,transparent 80%)"}}/>
      </Left>
      <FormPanel/>
    </div>
  );
}

/* ── TEXTURE 3: Diagonal linen / hatching ── */
function TextureLinen() {
  return (
    <div style={{display:"flex",height:"100%",background:"#faf7f2"}}>
      <Left>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%"}} xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hatch" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="14" stroke="#b5451b" strokeWidth="0.7" opacity="0.14"/>
            </pattern>
            <pattern id="hatch2" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
              <line x1="0" y1="0" x2="0" y2="14" stroke="#7a4a2a" strokeWidth="0.5" opacity="0.08"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#hatch)"/>
          <rect width="100%" height="100%" fill="url(#hatch2)"/>
        </svg>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 52% 52% at 50% 50%,#f2ebe0 28%,rgba(242,235,224,0.4) 70%,transparent 100%)"}}/>
      </Left>
      <FormPanel/>
    </div>
  );
}

/* ── TEXTURE 4: Large ghosted letterform ── */
function TextureLetter() {
  return (
    <div style={{display:"flex",height:"100%",background:"#faf7f2"}}>
      <Left>
        {/* giant "N" behind everything */}
        <div style={{
          position:"absolute",
          fontSize:520,
          fontFamily:"'DM Serif Display',serif",
          fontStyle:"italic",
          color:"transparent",
          WebkitTextStroke:"1.5px rgba(181,69,27,0.14)",
          lineHeight:1,
          top:"50%",left:"50%",
          transform:"translate(-50%,-52%)",
          userSelect:"none",
          pointerEvents:"none",
          whiteSpace:"nowrap"
        }}>N</div>
        {/* subtle radial vignette */}
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 60% 60% at 50% 50%,#f2ebe0 20%,rgba(242,235,224,0.5) 65%,rgba(242,235,224,0.1) 100%)"}}/>
        {/* thin terracotta rule above tagline */}
        <div style={{position:"absolute",bottom:48,left:48,right:48,zIndex:2,display:"flex",alignItems:"center",gap:12}}>
          <div style={{height:1,flex:1,background:"rgba(181,69,27,0.2)"}}/>
          <span style={{fontSize:10,color:"#b8a090",fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.1em"}}>QUEEN'S UNIVERSITY</span>
          <div style={{height:1,flex:1,background:"rgba(181,69,27,0.2)"}}/>
        </div>
      </Left>
      <FormPanel/>
    </div>
  );
}

/* ── TEXTURE 5: Noise grain + large arc ── */
function TextureArc() {
  return (
    <div style={{display:"flex",height:"100%",background:"#faf7f2"}}>
      <Left>
        {/* large arc / quarter circle */}
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.18}} viewBox="0 0 620 600" preserveAspectRatio="xMidYMid slice">
          <circle cx="310" cy="600" r="420" fill="none" stroke="#b5451b" strokeWidth="1.5"/>
          <circle cx="310" cy="600" r="340" fill="none" stroke="#b5451b" strokeWidth="1"/>
          <circle cx="310" cy="600" r="260" fill="none" stroke="#7a4a2a" strokeWidth="0.8"/>
          <circle cx="310" cy="600" r="180" fill="none" stroke="#7a4a2a" strokeWidth="0.8"/>
          <circle cx="310" cy="600" r="100" fill="none" stroke="#b5451b" strokeWidth="1"/>
          {/* cross hairs */}
          <line x1="310" y1="0" x2="310" y2="600" stroke="#b5451b" strokeWidth="0.6" opacity="0.5"/>
          <line x1="-100" y1="350" x2="720" y2="350" stroke="#7a4a2a" strokeWidth="0.4" opacity="0.5"/>
        </svg>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 55% 55% at 50% 48%,#f2ebe0 30%,rgba(242,235,224,0.3) 80%,transparent 100%)"}}/>
      </Left>
      <FormPanel/>
    </div>
  );
}

const OPTS = [
  {id:"dots",  label:"Dot Grid",        sub:"Uniform dot field · radial fade to center",           C:TextureDots},
  {id:"topo",  label:"Topographic",     sub:"Concentric contour rings · map-like depth",            C:TextureTopo},
  {id:"linen", label:"Linen Hatching",  sub:"Crossed diagonal lines · woven textile feel",          C:TextureLinen},
  {id:"letter",label:"Ghosted Letter",  sub:"Oversized outlined 'N' · typographic identity",        C:TextureLetter},
  {id:"arc",   label:"Radial Arcs",     sub:"Concentric circles from bottom · technical / precise", C:TextureArc},
];

function App() {
  const [active,setActive]=useState(null);
  const [tweaks,setTweaks]=useState(false);

  useEffect(()=>{
    window.addEventListener("message",e=>{
      if(e.data?.type==="__activate_edit_mode") setTweaks(true);
      if(e.data?.type==="__deactivate_edit_mode") setTweaks(false);
    });
    window.parent.postMessage({type:"__edit_mode_available"},"*");
  },[]);

  return (
    <div className="wrap">
      <div className="hdr">
        <div className="hdr-logo">nest · left panel textures</div>
        <div className="hdr-pills">
          <button className={`pill${active===null?" on":""}`} onClick={()=>setActive(null)}>All</button>
          {OPTS.map(o=>(
            <button key={o.id} className={`pill${active===o.id?" on":""}`} onClick={()=>setActive(active===o.id?null:o.id)}>{o.label}</button>
          ))}
        </div>
      </div>
      <div className="scroll">
        {OPTS.filter(o=>active===null||o.id===active).map(({id,label,sub,C})=>(
          <div key={id}>
            <div className="section-lbl"><strong>{label}</strong> — {sub}</div>
            <div className="frame"><C/></div>
          </div>
        ))}
      </div>
      <div className={`tweaks-panel${tweaks?" on":""}`}>
        <div className="tw-title">Tweaks</div>
        <div className="tw-lbl">Show option</div>
        <div className="tw-opts">
          <div className={`tw-opt${active===null?" on":""}`} onClick={()=>setActive(null)}>All</div>
          {OPTS.map(o=>(
            <div key={o.id} className={`tw-opt${active===o.id?" on":""}`} onClick={()=>setActive(active===o.id?null:o.id)}>{o.label}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
