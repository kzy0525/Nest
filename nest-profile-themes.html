<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Nest — Profile Themes</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1410;font-family:'DM Sans',sans-serif;overflow:hidden;}
.wrap{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#111009;border-bottom:1px solid #2a2318;}
.hdr-logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:#e8dcc8;}
.hdr-pills{display:flex;gap:6px;}
.pill{font-size:11px;color:#6b5e4a;background:#1e1a13;border:1px solid #2e2820;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all .14s;font-family:'Space Grotesk',sans-serif;}
.pill.on{color:#e8dcc8;background:#2e2820;border-color:#3e3428;}
.scroll{flex:1;overflow:auto;padding:36px 36px 56px;display:flex;flex-direction:column;gap:52px;}
.sec-lbl{font-family:'Space Grotesk',sans-serif;font-size:10px;color:#3e3428;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.sec-lbl strong{color:#7a6a54;}
.frame{border-radius:12px;overflow:hidden;border:1px solid #2a2318;width:1100px;height:680px;flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const T = {
  bg:"#faf7f2", sidebar:"#f3ede3", card:"#fff",
  accent:"#b5451b", heading:"#2a1f14",
  muted:"#a09180", faint:"#c4b49a",
  border:"#e8e0d4", borderLight:"#f0ebe3",
  tag:"#f5f0e8",
};

const CLUBS = [
  {name:"Queen's Tech & Media Association",short:"QTMA",color:"#1565C0",role:"Software Developer",since:"Sep 2023"},
  {name:"Queen's Startup Consulting",short:"QSC",color:"#111",role:"Business Analyst",since:"Jan 2024"},
];
const APPLYING = [
  {name:"Smith Engineering Hyperloop",short:"SEH",color:"#1a2a3a",status:"incomplete"},
  {name:"Queen's Musical Theatre",short:"QMT",color:"#1a3a6e",status:"interview"},
];
const STATUS_META = {
  incomplete:{label:"Incomplete",bg:"#fef3cd",color:"#8a6200"},
  interview:{label:"Interview",bg:"#e8f5e9",color:"#2e7d32"},
};

function Sidebar({active=4}) {
  return (
    <div style={{width:56,background:T.sidebar,borderRight:`1px solid ${T.border}`,display:"flex",flexDirection:"column",alignItems:"center",paddingTop:18,gap:6,flexShrink:0}}>
      {["🏠","🧭","♡","✏","○"].map((ic,i)=>(
        <div key={i} style={{width:36,height:36,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:i===active?"#ede8df":"transparent",color:i===active?T.accent:"#c4b89e",fontSize:15,cursor:"pointer"}}>{ic}</div>
      ))}
      <div style={{marginTop:"auto",marginBottom:16,color:"#c4b89e",fontSize:15}}>↗</div>
    </div>
  );
}

function Avatar({size=72,initials="KY"}) {
  return (
    <div style={{width:size,height:size,borderRadius:"50%",background:"linear-gradient(135deg,#e8c4a0,#c4906a)",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",border:`3px solid #fff`,boxShadow:"0 2px 12px rgba(0,0,0,0.1)"}}>
      <span style={{fontFamily:"'DM Serif Display',serif",fontSize:size*0.3,color:"#fff",fontStyle:"italic"}}>{initials}</span>
    </div>
  );
}

function Tag({children,color="#a09180",bg="#f5f0e8"}) {
  return <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:bg,color,fontFamily:"'Space Grotesk',sans-serif"}}>{children}</span>;
}

function ClubRow({club,compact}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:12,padding:compact?"10px 14px":"13px 16px",background:T.card,borderRadius:12,border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
      <div style={{width:compact?32:36,height:compact?32:36,borderRadius:9,background:club.color,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,fontSize:9,color:"rgba(255,255,255,0.4)"}}>{club.short.slice(0,2)}</span>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:compact?12:13,fontWeight:500,color:T.heading,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{club.name}</div>
        {club.role && <div style={{fontSize:10,color:T.accent,fontFamily:"'DM Sans',sans-serif",marginTop:1}}>{club.role}</div>}
        {club.since && <div style={{fontSize:10,color:T.faint,fontFamily:"'DM Sans',sans-serif",marginTop:1}}>Member since {club.since}</div>}
      </div>
      {club.status && <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:STATUS_META[club.status].bg,color:STATUS_META[club.status].color,fontFamily:"'Space Grotesk',sans-serif",whiteSpace:"nowrap"}}>{STATUS_META[club.status].label}</span>}
      <span style={{color:T.faint,cursor:"pointer",fontSize:13}}>···</span>
    </div>
  );
}

function SectionHead({title,action}) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <div style={{fontFamily:"'Instrument Serif',serif",fontSize:16,color:T.heading}}>{title}</div>
      {action && <button style={{fontSize:11,padding:"5px 12px",borderRadius:8,background:T.accent,color:"#fff",border:"none",cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>{action}</button>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// A: Sidebar profile + scrollable content
// ══════════════════════════════════════════════════════════════════
function ProfileA() {
  return (
    <div style={{display:"flex",height:"100%",background:T.bg}}>
      <Sidebar/>
      {/* sticky profile sidebar */}
      <div style={{width:240,background:T.sidebar,borderRight:`1px solid ${T.border}`,padding:"32px 24px",display:"flex",flexDirection:"column",gap:20,flexShrink:0,overflow:"auto"}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
          <Avatar size={80}/>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:20,color:T.heading}}>Kevin Ye</div>
            <div style={{fontSize:11,color:T.muted,fontFamily:"'DM Sans',sans-serif"}}>He/Him</div>
          </div>
          <button style={{fontSize:11,padding:"6px 16px",borderRadius:20,background:T.accent,color:"#fff",border:"none",cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>Edit Profile</button>
        </div>
        <div style={{height:1,background:T.border}}/>
        {[["📅","3rd Year"],["💻","Computer Science"],["📍","Queen's University"]].map(([ic,txt])=>(
          <div key={txt} style={{display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:13}}>{ic}</span>
            <span style={{fontSize:13,color:T.heading}}>{txt}</span>
          </div>
        ))}
        <div style={{height:1,background:T.border}}/>
        <div>
          <div style={{fontSize:10,color:T.muted,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.06em",marginBottom:8}}>INTERESTS</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {["Design","Tech","Consulting","Product"].map(t=><Tag key={t}>{t}</Tag>)}
          </div>
        </div>
        <div style={{height:1,background:T.border}}/>
        <div>
          <div style={{fontSize:10,color:T.muted,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.06em",marginBottom:6}}>ABOUT</div>
          <div style={{fontSize:12,color:T.heading,lineHeight:1.6}}>Passionate about technology and innovation, with a focus on software development and product design.</div>
        </div>
        <div style={{marginTop:4,display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11}}>🔍</span>
          <span style={{fontSize:12,color:T.accent,fontStyle:"italic"}}>Open to design + consulting roles</span>
        </div>
      </div>
      {/* main content */}
      <div style={{flex:1,overflow:"auto",padding:"28px 28px"}}>
        <div style={{display:"flex",flexDirection:"column",gap:20}}>
          <div>
            <SectionHead title="Current Clubs" action="+ Add Club"/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {CLUBS.map((c,i)=><ClubRow key={i} club={c}/>)}
            </div>
          </div>
          <div>
            <SectionHead title="Currently Applying For"/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {APPLYING.map((c,i)=><ClubRow key={i} club={c}/>)}
            </div>
          </div>
          <div>
            <SectionHead title="Activity"/>
            <div style={{background:T.card,borderRadius:14,border:`1px solid ${T.border}`,padding:"16px 18px"}}>
              {[
                {action:"Submitted application to",target:"Queen's Musical Theatre",when:"2 days ago"},
                {action:"Joined",target:"Queen's Startup Consulting",when:"Jan 2024"},
                {action:"Completed profile",target:"",when:"Mar 2024"},
              ].map((a,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",paddingBottom:i<2?12:0,borderBottom:i<2?`1px solid ${T.borderLight}`:"none",marginBottom:i<2?12:0}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:T.accent,marginTop:5,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <span style={{fontSize:12,color:T.heading}}>{a.action} </span>
                    {a.target && <span style={{fontSize:12,color:T.accent,fontWeight:500}}>{a.target}</span>}
                  </div>
                  <span style={{fontSize:10,color:T.faint,fontFamily:"'Space Grotesk',sans-serif",flexShrink:0}}>{a.when}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// B: Warm banner + stacked cards, centered
// ══════════════════════════════════════════════════════════════════
function ProfileB() {
  return (
    <div style={{display:"flex",height:"100%",background:T.bg}}>
      <Sidebar/>
      <div style={{flex:1,overflow:"auto"}}>
        {/* banner */}
        <div style={{height:140,background:"linear-gradient(120deg,#c8a882,#b5451b,#7a3a18)",position:"relative",flexShrink:0}}>
          {/* arc texture */}
          <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.12}} viewBox="0 0 900 140" preserveAspectRatio="xMidYMid slice">
            {[200,280,360,440].map((r,i)=>(
              <circle key={i} cx="450" cy="140" r={r} fill="none" stroke="#fff" strokeWidth="1"/>
            ))}
          </svg>
          <button style={{position:"absolute",top:12,right:14,background:"rgba(255,255,255,0.2)",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",fontSize:11,padding:"5px 12px",borderRadius:20,cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",backdropFilter:"blur(4px)"}}>Edit banner</button>
        </div>

        <div style={{padding:"0 32px 32px",maxWidth:800,margin:"0 auto"}}>
          {/* identity row */}
          <div style={{display:"flex",alignItems:"flex-end",gap:18,marginBottom:20,marginTop:-36}}>
            <Avatar size={72}/>
            <div style={{paddingBottom:4,flex:1}}>
              <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,color:T.heading}}>Kevin Ye</div>
                <div style={{fontSize:12,color:T.muted,fontFamily:"'DM Sans',sans-serif"}}>He/Him</div>
              </div>
              <div style={{display:"flex",gap:14,marginTop:4}}>
                {["3rd Year","Computer Science","Queen's University"].map(t=>(
                  <span key={t} style={{fontSize:11,color:T.muted}}>{t}</span>
                ))}
              </div>
            </div>
            <button style={{paddingBottom:4,fontSize:11,color:T.accent,background:"none",border:"none",cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>✎ Edit</button>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {/* about */}
            <div style={{background:T.card,borderRadius:16,padding:"18px 20px",border:`1px solid ${T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                <div style={{fontFamily:"'Instrument Serif',serif",fontSize:16,color:T.heading}}>About Me</div>
                <span style={{fontSize:12,color:T.faint,cursor:"pointer"}}>✎</span>
              </div>
              <div style={{fontSize:13,color:T.heading,lineHeight:1.7,marginBottom:10}}>Passionate about technology and innovation, with a focus on software development and product design.</div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:12}}>🔍</span>
                <span style={{fontSize:12,color:T.accent,fontStyle:"italic"}}>Looking for design + consulting roles in tech companies and startups</span>
              </div>
              <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
                {["Design","Technology","Product","Consulting"].map(t=><Tag key={t}>{t}</Tag>)}
              </div>
            </div>

            {/* clubs */}
            <div style={{background:T.card,borderRadius:16,padding:"18px 20px",border:`1px solid ${T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
              <SectionHead title="Current Clubs" action="+ Add Club"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {CLUBS.map((c,i)=><ClubRow key={i} club={c} compact/>)}
              </div>
            </div>

            {/* applying */}
            <div style={{background:T.card,borderRadius:16,padding:"18px 20px",border:`1px solid ${T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
              <SectionHead title="Currently Applying For"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {APPLYING.map((c,i)=><ClubRow key={i} club={c} compact/>)}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// C: Two-column layout with stats strip
// ══════════════════════════════════════════════════════════════════
function ProfileC() {
  return (
    <div style={{display:"flex",height:"100%",background:T.bg}}>
      <Sidebar/>
      <div style={{flex:1,overflow:"auto",padding:"24px 24px"}}>
        {/* header strip */}
        <div style={{background:T.card,borderRadius:16,padding:"20px 24px",border:`1px solid ${T.border}`,marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
          <div style={{display:"flex",alignItems:"center",gap:18}}>
            <Avatar size={64}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:4}}>
                <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,color:T.heading}}>Kevin Ye</div>
                <div style={{fontSize:12,color:T.muted}}>He/Him · 3rd Year · Computer Science</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {["Design","Technology","Product","Consulting"].map(t=><Tag key={t}>{t}</Tag>)}
              </div>
            </div>
            <button style={{fontSize:11,padding:"7px 16px",borderRadius:10,background:T.accent,color:"#fff",border:"none",cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>Edit Profile</button>
          </div>
          {/* stats strip */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:0,marginTop:18,paddingTop:16,borderTop:`1px solid ${T.borderLight}`}}>
            {[["2","Current Clubs"],["2","Applications"],["1","Interviews"],["Sep 2023","Member Since"]].map(([v,l],i)=>(
              <div key={i} style={{textAlign:"center",borderRight:i<3?`1px solid ${T.borderLight}`:"none"}}>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:T.heading}}>{v}</div>
                <div style={{fontSize:10,color:T.muted,fontFamily:"'Space Grotesk',sans-serif",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* two column */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          {/* left col */}
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{background:T.card,borderRadius:14,padding:"16px 18px",border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <SectionHead title="About Me"/>
              <div style={{fontSize:13,color:T.heading,lineHeight:1.7,marginBottom:10}}>Passionate about technology and innovation, with a focus on software development and product design.</div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:12}}>🔍</span>
                <span style={{fontSize:12,color:T.accent,fontStyle:"italic"}}>Open to design + consulting roles</span>
              </div>
            </div>
            <div style={{background:T.card,borderRadius:14,padding:"16px 18px",border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <SectionHead title="Current Clubs" action="+ Add"/>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {CLUBS.map((c,i)=><ClubRow key={i} club={c} compact/>)}
              </div>
            </div>
          </div>
          {/* right col */}
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{background:T.card,borderRadius:14,padding:"16px 18px",border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <SectionHead title="Applying For"/>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {APPLYING.map((c,i)=><ClubRow key={i} club={c} compact/>)}
              </div>
            </div>
            <div style={{background:T.card,borderRadius:14,padding:"16px 18px",border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <SectionHead title="Recent Activity"/>
              {[
                {action:"Applied to Queen's Musical Theatre","when":"2 days ago"},
                {action:"Joined Queen's Startup Consulting","when":"Jan 2024"},
                {action:"Profile completed","when":"Mar 2024"},
              ].map((a,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",paddingBottom:i<2?10:0,borderBottom:i<2?`1px solid ${T.borderLight}`:"none",marginBottom:i<2?10:0}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:T.accent,marginTop:5,flexShrink:0}}/>
                  <div style={{flex:1,fontSize:12,color:T.heading}}>{a.action}</div>
                  <span style={{fontSize:10,color:T.faint,fontFamily:"'Space Grotesk',sans-serif",flexShrink:0}}>{a.when}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// D: Editorial — horizontal identity + tabbed sections
// ══════════════════════════════════════════════════════════════════
function ProfileD() {
  const [tab, setTab] = useState("clubs");
  return (
    <div style={{display:"flex",height:"100%",background:T.bg}}>
      <Sidebar/>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* top band */}
        <div style={{flexShrink:0,background:"#f2ebe0",borderBottom:`1px solid ${T.border}`,padding:"24px 28px"}}>
          <div style={{display:"flex",alignItems:"center",gap:20}}>
            <Avatar size={68}/>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:26,color:T.heading,letterSpacing:"-0.5px",marginBottom:2}}>Kevin Ye <span style={{fontSize:14,color:T.muted,fontFamily:"'DM Sans',sans-serif",fontWeight:400,letterSpacing:0}}>He/Him</span></div>
              <div style={{fontSize:12,color:T.muted,marginBottom:8}}>3rd Year · Computer Science · Queen's University</div>
              <div style={{fontSize:12,color:T.accent,fontStyle:"italic",fontFamily:"'Instrument Serif',serif"}}>
                "Passionate about tech and innovation — open to design and consulting."
              </div>
            </div>
            <div style={{display:"flex",flex:"0 0 auto",gap:24,paddingLeft:20,borderLeft:`1px solid ${T.border}`}}>
              {[["2","Clubs"],["2","Applied"],["1","Interview"]].map(([v,l])=>(
                <div key={l} style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:T.heading}}>{v}</div>
                  <div style={{fontSize:10,color:T.muted,fontFamily:"'Space Grotesk',sans-serif"}}>{l}</div>
                </div>
              ))}
            </div>
            <button style={{fontSize:11,padding:"7px 14px",borderRadius:10,background:"transparent",border:`1px solid ${T.border}`,color:T.muted,cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif"}}>✎ Edit</button>
          </div>
        </div>

        {/* tabs */}
        <div style={{flexShrink:0,background:T.card,borderBottom:`1px solid ${T.border}`,display:"flex",padding:"0 28px"}}>
          {["clubs","applying","about","activity"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{
              fontSize:12,padding:"12px 16px",border:"none",background:"transparent",cursor:"pointer",
              color:tab===t?T.heading:T.muted,
              borderBottom:tab===t?`2px solid ${T.accent}`:"2px solid transparent",
              fontFamily:"'Space Grotesk',sans-serif",fontWeight:tab===t?600:400,
              letterSpacing:"0.04em",textTransform:"capitalize",transition:"all .15s"
            }}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>
          ))}
        </div>

        {/* tab content */}
        <div style={{flex:1,overflow:"auto",padding:"24px 28px"}}>
          {tab==="clubs" && (
            <div>
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
                <button style={{fontSize:11,padding:"6px 14px",borderRadius:8,background:T.accent,color:"#fff",border:"none",cursor:"pointer",fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>+ Add Club</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {CLUBS.map((c,i)=>(
                  <div key={i} style={{background:T.card,borderRadius:14,padding:"16px 18px",border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:14,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                    <div style={{width:40,height:40,borderRadius:10,background:c.color,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      <span style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,fontSize:10,color:"rgba(255,255,255,0.4)"}}>{c.short.slice(0,2)}</span>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:500,color:T.heading}}>{c.name}</div>
                      <div style={{fontSize:12,color:T.accent,marginTop:2}}>{c.role}</div>
                    </div>
                    <div style={{fontSize:11,color:T.faint,fontFamily:"'Space Grotesk',sans-serif"}}>Since {c.since}</div>
                    <span style={{color:T.faint,cursor:"pointer"}}>···</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {tab==="applying" && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {APPLYING.map((c,i)=><ClubRow key={i} club={c}/>)}
            </div>
          )}
          {tab==="about" && (
            <div style={{background:T.card,borderRadius:14,padding:"20px 22px",border:`1px solid ${T.border}`,maxWidth:600,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <div style={{fontSize:14,color:T.heading,lineHeight:1.8,marginBottom:14}}>Passionate about technology and innovation, with a focus on software development and product design.</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
                {["Design","Technology","Product","Consulting"].map(t=><Tag key={t}>{t}</Tag>)}
              </div>
              <div style={{fontSize:12,color:T.accent,fontStyle:"italic",fontFamily:"'Instrument Serif',serif",fontSize:14}}>🔍 Looking for design + consulting roles in tech companies and startups.</div>
            </div>
          )}
          {tab==="activity" && (
            <div style={{background:T.card,borderRadius:14,padding:"18px 20px",border:`1px solid ${T.border}`,maxWidth:600,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              {[
                {action:"Submitted application to Queen's Musical Theatre","when":"2 days ago"},
                {action:"Interview scheduled with QMT","when":"3 days ago"},
                {action:"Joined Queen's Startup Consulting","when":"Jan 2024"},
                {action:"Profile completed","when":"Mar 2024"},
              ].map((a,i,arr)=>(
                <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",paddingBottom:i<arr.length-1?12:0,borderBottom:i<arr.length-1?`1px solid ${T.borderLight}`:"none",marginBottom:i<arr.length-1?12:0}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:T.accent,marginTop:6,flexShrink:0}}/>
                  <div style={{flex:1,fontSize:13,color:T.heading}}>{a.action}</div>
                  <span style={{fontSize:10,color:T.faint,fontFamily:"'Space Grotesk',sans-serif",flexShrink:0}}>{a.when}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// Canvas
// ══════════════════════════════════════════════════════════════════
const OPTS = [
  {id:"a",label:"Sidebar Profile",  sub:"Fixed info panel left · clubs + activity scrollable right",           C:ProfileA},
  {id:"b",label:"Banner + Cards",   sub:"Warm terracotta banner · stacked full-width cards · 2-col clubs",     C:ProfileB},
  {id:"c",label:"Two-Column Grid",  sub:"Horizontal identity strip with stats · two-column card grid below",   C:ProfileC},
  {id:"d",label:"Editorial + Tabs", sub:"Horizontal header with quote · tabbed section navigation",            C:ProfileD},
];

function App() {
  const [active,setActive]=useState(null);
  const [tweaks,setTweaks]=useState(false);
  React.useEffect(()=>{
    window.addEventListener("message",e=>{
      if(e.data?.type==="__activate_edit_mode") setTweaks(true);
      if(e.data?.type==="__deactivate_edit_mode") setTweaks(false);
    });
    window.parent.postMessage({type:"__edit_mode_available"},"*");
  },[]);
  return (
    <div className="wrap">
      <div className="hdr">
        <div className="hdr-logo">nest · profile page</div>
        <div className="hdr-pills">
          <button className={`pill${active===null?" on":""}`} onClick={()=>setActive(null)}>All</button>
          {OPTS.map(o=>(
            <button key={o.id} className={`pill${active===o.id?" on":""}`} onClick={()=>setActive(active===o.id?null:o.id)}>{o.label}</button>
          ))}
        </div>
      </div>
      <div className="scroll">
        {OPTS.filter(o=>active===null||o.id===active).map(({id,label,sub,C})=>(
          <div key={id}>
            <div className="sec-lbl"><strong>{label}</strong> — {sub}</div>
            <div className="frame"><C/></div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
